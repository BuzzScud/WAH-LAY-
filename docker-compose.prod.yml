# Production on the droplet: caddy -> app -> db.
# Postgres is NOT published to the host — internal Docker network only.
# Build the image off-box (locally or GitHub Actions), push to a registry,
# then on the droplet:
#   docker compose --env-file .env.production -f docker-compose.prod.yml pull
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
# NOTE: the --env-file flag is required — ${DB_PASSWORD} below is compose-file
# interpolation, which reads the shell env / --env-file, NOT `env_file:`.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    # Registry path must be lowercase, e.g. ghcr.io/buzzscud/chinese-takeout
    image: ghcr.io/CHANGE-ME/chinese-takeout:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://takeout:${DB_PASSWORD}@db:5432/takeout
      HOST: 0.0.0.0
      PORT: '3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: takeout
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: takeout
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U takeout']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  caddy_data:
  caddy_config:
