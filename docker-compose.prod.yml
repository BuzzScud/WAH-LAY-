# Production on the droplet: caddy -> app -> db.
# Postgres is NOT published to the host — internal Docker network only.
# Build the image off-box (locally or GitHub Actions), push to a registry,
# then on the droplet: docker compose -f docker-compose.prod.yml pull && up -d
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    image: ghcr.io/CHANGE-ME/chinese-takeout:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://takeout:${DB_PASSWORD}@db:5432/takeout
      HOST: 0.0.0.0
      PORT: '3000'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: takeout
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: takeout
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U takeout']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  caddy_data:
  caddy_config:
